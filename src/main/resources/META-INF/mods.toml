modLoader = "javafml"
# NeoForge 20.1（= 1.20.1-47.1.x）把自己的 javafml 版本改成了 24.x，
# 而 Forge 47.2 那一代是 47.x。写死任何一个区间都会让另一边加载失败，
# 所以这里放到最宽：本模组只用最基础的 FML 能力，不挑版本。
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Mewzica/World-Edit-Select/issues"

[[mods]]
modId = "wes"
version = "${version}"
displayName = "World Edit Select"
authors = "Mewzica"
logoFile = "assets/wes/icon.png"
description = '''
World Edit Select (WES) —— 在聊天框输入 //set （带空格）即可弹出方块选择面板，点选方块并分配百分比，一键生成 //set 指令。
'''

[[dependencies.wes]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.wes]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"

# WorldEdit 不是硬依赖：装是世界编辑器的语法糖入口，不装就只剩原版方块表。
[[dependencies.wes]]
modId = "worldedit"
mandatory = false
versionRange = "[7.2.0,)"
ordering = "NONE"
side = "CLIENT"

# 注意：1.20.1 的 Forge 不解析 mods.toml 里的 [[mixins]] 段（那是 NeoForge 的东西）。
# Mixin 配置是通过 jar manifest 的 MixinConfigs 属性声明的，见 build.gradle 的 jar {} 块。
