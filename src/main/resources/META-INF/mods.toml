modLoader = "javafml"
loaderVersion = "[49,)"
license = "MIT"
issueTrackerURL = "https://github.com/Mewzica/World-Edit-Select/issues"

[[mods]]
modId = "wes"
version = "${version}"
displayName = "World Edit Select"
authors = "Mewzica"
logoFile = "assets/wes/icon.png"
description = '''
World Edit Select (WES) —— 在聊天框输入 //set （带空格）即可弹出方块选择面板，点选方块并分配百分比，一键生成 //set 指令。
'''

[[dependencies.wes]]
modId = "forge"
mandatory = true
versionRange = "[49,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.wes]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.4,1.20.5)"
ordering = "NONE"
side = "CLIENT"

# WorldEdit 不是硬依赖：装是世界编辑器的语法糖入口，不装就只剩原版方块表。
[[dependencies.wes]]
modId = "worldedit"
mandatory = false
versionRange = "[7.2.0,)"
ordering = "NONE"
side = "CLIENT"

# 注意：1.20.1 的 Forge 不解析 mods.toml 里的 [[mixins]] 段（那是 NeoForge 的东西）。
# Mixin 配置是通过 jar manifest 的 MixinConfigs 属性声明的，见 build.gradle 的 jar {} 块。
