plugins {
    id 'java'
    // NeoGradle 7：NeoForge 1.20.4 官方 MDK（MDK-1.20.4-NeoGradle）用的就是它。
    // ModDevGradle 要 NeoForge 的 moddev-bundle 能力，20.4 这一代还没有。
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'dev.wes'

base {
    archivesName = 'wes'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// NeoGradle 用 JavaSourceTransformer 处理 Minecraft 源码，它自己需要 Java 21 才能跑，
// 而模组本身仍然编译到 17。CI 上只有 JDK 17，所以让它按需取一个 21 的工具链。
tasks.withType(net.neoforged.gradle.common.runtime.tasks.JavaSourceTransformer).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Mixin 说明：NeoForge 从 1.20.2 起运行期就用 Mojang 官方名，本工程编译期也是官方名，
// 注入点和目标方法名一一对应，不需要 refmap 做二次翻译。所以这里不装 MixinGradle，
// wes.mixins.json 里也不写 "refmap"——写了只会指向一个永远不存在的文件。
// （1.20.1 的两个分支运行期是 SRG 名，那两个分支才需要并会生成 wes.refmap.json。）
runs {
    client {
        systemProperty 'forge.logging.markers', ''
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }
}

repositories {
    // WorldEdit 的 Maven 仓库（worldedit-core 就在这里）
    maven { name = 'EngineHub'; url = 'https://maven.enginehub.org/repo/' }
    mavenCentral()
}

dependencies {
    // NeoGradle 的 userdev：坐标是 net.neoforged:neoforge:<neo 版本号>
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // 只需要 WorldEdit 的「核心 API」（BlockType / BlockFactory / Registry 等）。
    // 这些类与 Minecraft 版本无关，所以直接拿 worldedit-core 编译即可；
    // 运行期真正的实现由玩家安装的 WorldEdit 模组提供，不打包、不重映射。
    compileOnly "com.sk89q.worldedit:worldedit-core:${worldedit_version}"

    // NeoForge 运行期自带 Mixin，这里只要编译期的注解与注解处理器
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : 'wes',
                'Specification-Vendor'   : 'Mewzica',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'Mewzica',
                // mods.toml 里也声明了 [[mixins]]，manifest 这条是双保险
                'MixinConfigs'           : 'wes.mixins.json'
        ])
    }
}
