plugins {
    id 'java'
    // ModDevGradle：NeoForge 20.2+（含 1.20.4）的官方推荐构建插件。
    // 它取代了 1.20.1 时代的 ForgeGradle，坐标也从 net.neoforged:forge 换成了 net.neoforged:neoforge。
    id 'net.neoforged.moddev' version '1.0.23'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'dev.wes'

base {
    archivesName = 'wes'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

neoForge {
    // 这里只写 NeoForge 自己的版本号（20.4.237）。ModDevGradle 解析的是
    // net.neoforged:neoforge:<version>，加 "1.20.4-" 前缀会找不到坐标。
    version = "${neoforge_version}"

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // 开发环境里 Mixin 的 refmap 需要按运行时映射重映射一次
            systemProperty 'mixin.env.remapRefMap', 'true'
        }
    }

    mods {
        wes {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // WorldEdit 的 Maven 仓库（worldedit-core 就在这里）
    maven { name = 'EngineHub'; url = 'https://maven.enginehub.org/repo/' }
    mavenCentral()
}

dependencies {
    // 只需要 WorldEdit 的「核心 API」（BlockType / BlockFactory / Registry 等）。
    // 这些类与 Minecraft 版本无关，所以直接拿 worldedit-core 编译即可；
    // 运行期真正的实现由玩家安装的 WorldEdit 模组提供，不打包、不重映射。
    compileOnly "com.sk89q.worldedit:worldedit-core:${worldedit_version}"

    // NeoForge 运行期自带 Mixin，这里只需要编译期的注解与注解处理器。
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : 'wes',
                'Specification-Vendor'   : 'Mewzica',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'Mewzica',
                // NeoForge 也认 mods.toml 里的 [[mixins]]，但 manifest 这条更保险
                'MixinConfigs'           : 'wes.mixins.json'
        ])
    }
}
