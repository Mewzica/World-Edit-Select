name: Gradle Build

on:
  push:
    branches:
      - "1.20.4/NeoForge"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - "1.20.4/NeoForge"
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (NeoForge 20.4)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # ForgeGradle 要下载 Minecraft / Forge userdev 并反编译，
          # 缓存住 GRADLE_USER_HOME 能让后续构建从十几分钟降到一分钟级。
          cache-read-only: ${{ github.ref != 'refs/heads/1.20.4/NeoForge' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show produced jars
        run: ls -l build/libs

      # Forge 的 jar 里同时会有 -sources / -slim 之类的伴生包，这里只要主 jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wes-neoforge-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-slim.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
