name: Gradle Build

on:
  push:
    branches:
      - "1.20.1/Fabric"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - "1.20.1/Fabric"
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show produced jars
        run: ls -l build/libs

      # 只保留重映射后的产物，跳过 -sources / -dev / -slim 这类中间 jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wes-fabric-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-slim.jar
          if-no-files-found: error
          retention-days: 14
