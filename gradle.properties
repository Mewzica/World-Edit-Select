# ---------------------------------------------------------------------------
# 构建配置（NeoForge 分支）
# 版本号：如需调整，只改这一行（下面的 version 会自动拼接 MC 版本）
# ---------------------------------------------------------------------------
mod_version=0.1.1-beta

minecraft_version=1.20.4
# NeoForge 版本（https://maven.neoforged.net/releases/net/neoforged/neoforge/）
# 1.20.4 这一代坐标是 net.neoforged:neoforge，modId 也从 forge 改成了 neoforge。
neoforge_version=20.4.237

# WorldEdit 只做「编译期」依赖（compileOnly）：
# 运行期由玩家自己安装的 WorldEdit 模组提供这些类，我们不打包、不重映射。
worldedit_version=7.2.15

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false
